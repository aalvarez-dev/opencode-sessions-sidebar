name: Pinned sidebar stability campaign

on:
  pull_request:
    paths:
      - ".github/diagnostics/stability-campaign.ts"
      - ".github/diagnostics/stability-tracker.mjs"
      - ".github/workflows/isolated-stability.yml"
      - "docs/stability-campaign.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-gates:
    name: Original gates / campaign ${{ matrix.campaign }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        campaign: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4f5f1ba3cd5ac4facef0e93cd9668f6aaf32d417
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Prepare identical pinned candidate and native host
        run: |
          npm install --prefix "$RUNNER_TEMP/sidebar-tools" --no-audit --no-fund opencode-linux-x64-baseline@1.18.30
          echo "OPENCODE_BIN=$RUNNER_TEMP/sidebar-tools/node_modules/opencode-linux-x64-baseline/bin/opencode" >> "$GITHUB_ENV"
          bun install --frozen-lockfile
          bun run build
          echo 'a91d70019f34307548355234859f80130bac1cc8483adee6bdcc9535bf1a472d  dist/tui.js' | sha256sum --check --strict
          mkdir -p .sidebar-lab/stability
          git rev-parse HEAD > .sidebar-lab/stability/candidate-sha.txt
          sha256sum "$RUNNER_TEMP/sidebar-tools/node_modules/opencode-linux-x64-baseline/bin/opencode" > .sidebar-lab/stability/host-sha256.txt
      - name: Original short gates / 25 and 250 sessions / three pairs each
        id: short
        continue-on-error: true
        env:
          SIDEBAR_RESOURCE_REPORT: ${{ github.workspace }}/.sidebar-lab/stability/short.json
        run: bun run benchmark:sidebar:runtime
      - name: Original delayed gate / 250 sessions / three pairs
        id: delayed
        continue-on-error: true
        env:
          SIDEBAR_RESOURCE_DELAYED: "true"
          SIDEBAR_RESOURCE_REPORT: ${{ github.workspace }}/.sidebar-lab/stability/delayed.json
        run: bun run benchmark:sidebar:runtime
      - name: Retain every pair including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stability-campaign-${{ matrix.campaign }}
          path: .sidebar-lab/stability/
          include-hidden-files: true
          retention-days: 14
      - name: Require both original gates
        if: always()
        env:
          SHORT_RESULT: ${{ steps.short.outcome }}
          DELAYED_RESULT: ${{ steps.delayed.outcome }}
        run: test "$SHORT_RESULT" = success && test "$DELAYED_RESULT" = success

  observations:
    name: Separate ${{ matrix.mode }} observation
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        mode: [long-idle, cycles]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4f5f1ba3cd5ac4facef0e93cd9668f6aaf32d417
          path: candidate
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Prepare immutable target and native host
        run: |
          npm install --prefix "$RUNNER_TEMP/sidebar-tools" --no-audit --no-fund opencode-linux-x64-baseline@1.18.30
          echo "OPENCODE_BIN=$RUNNER_TEMP/sidebar-tools/node_modules/opencode-linux-x64-baseline/bin/opencode" >> "$GITHUB_ENV"
          cd candidate
          bun install --frozen-lockfile
          bun run build
          echo 'a91d70019f34307548355234859f80130bac1cc8483adee6bdcc9535bf1a472d  dist/tui.js' | sha256sum --check --strict
      - name: Execute fixed observation / no retry and no forced GC
        env:
          SIDEBAR_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          SIDEBAR_STABILITY_OUTPUT:
            ${{ github.workspace }}/.sidebar-lab/stability/${{ matrix.mode }}
        run: bun .github/diagnostics/stability-campaign.ts '${{ matrix.mode }}'
      - name: Retain protocol, generated observer and every receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stability-${{ matrix.mode }}
          path: |
            .sidebar-lab/stability/
            !.sidebar-lab/stability/**/node_modules/**
          include-hidden-files: true
          retention-days: 14
