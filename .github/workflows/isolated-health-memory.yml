name: Isolated health memory diagnostic

on:
  pull_request:
    paths:
      - ".github/diagnostics/health-memory.ts"
      - ".github/workflows/isolated-health-memory.yml"
      - "docs/health-memory-diagnostic.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-health-memory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-memory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Build the unchanged product with pinned tools
        run: |
          npm install --prefix "$RUNNER_TEMP/sidebar-tools" --no-audit --no-fund opencode-ai@1.18.30
          echo "OPENCODE_BIN=$RUNNER_TEMP/sidebar-tools/node_modules/.bin/opencode" >> "$GITHUB_ENV"
          bun install --frozen-lockfile
          bun run build
          mkdir -p .sidebar-lab/actions/health-memory
          git rev-parse HEAD > .sidebar-lab/actions/health-memory/checkout-sha.txt
      - name: Compare real and stub health transport without changing acceptance gates
        env:
          SIDEBAR_HEALTH_DIAGNOSTIC_DIR: ${{ github.workspace }}/.sidebar-lab/actions/health-memory
        run: bun .github/diagnostics/health-memory.ts
      - name: Retain every diagnostic report and wrapper on failure or success
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: health-memory-diagnostic
          path: .sidebar-lab/actions/health-memory/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
